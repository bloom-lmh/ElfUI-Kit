version: "0.2"
language: en,zh
useGitignore: true
enableGlobDot: true
files:
  - "**/*.{ts,tsx,js,mjs,cjs,md,scss,css,html,json,yaml,yml}"
ignorePaths:
  - .git/**
  - node_modules/**
  - dist/**
  - lib-dist/**
  - coverage/**
  - output/**
  - .playwright-cli/**
  - docs/screenshots/**
  - public/**
  - output-eslint.json
  - package-lock.json
  - pnpm-lock.yaml
  - src/elements.generated.d.ts
ignoreRegExpList:
  - /https?:\/\/[^\s)]+/g
  - /data:[^\s"']+/g
  - /#[0-9a-fA-F]{3,8}\b/g
  - /--[a-z0-9-]+/g
  - /[^\x00-\x7F]+/g
